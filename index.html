<style>
:root{--bg:#fbfaf7;--fg:#1d1d1f;--mute:#6e6e73;--line:#e3e1dc;--acc:#2f6fdb;--ok:#2e7d32;--fix:#b26a00}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1e;--fg:#f2f2f7;--mute:#a1a1a6;--line:#3a3a3c;--acc:#5e9bff;--ok:#66bb6a;--fix:#ffb74d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,system-ui,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 20px;display:flex;gap:16px;align-items:center}
header h1{font-size:16px;margin:0}#stat{color:var(--mute);font-variant-numeric:tabular-nums}
#keys{color:var(--mute);font-size:13px;margin-left:auto}
button{font:inherit;padding:5px 12px;border-radius:7px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
#bar{height:3px;background:var(--line)}#bar div{height:3px;background:var(--acc);width:0}
main{max-width:1100px;margin:0 auto;padding:12px 20px 60vh}
.row{display:grid;grid-template-columns:56px 1fr 1fr;gap:4px 18px;padding:7px 10px;border-radius:8px;border-left:3px solid transparent;opacity:.55}
.row.cur{opacity:1;background:color-mix(in srgb,var(--acc) 9%,transparent);border-left-color:var(--acc);padding:12px 10px}
.row.done{opacity:.4}.row.cur.done{opacity:1}
.n{color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px;padding-top:2px}
.en{white-space:pre-wrap}.fi{white-space:pre-wrap;font-weight:600}
.row.fixed .fi{text-decoration:line-through;font-weight:400;color:var(--mute)}
.ans{grid-column:3;color:var(--fix);font-weight:600;white-space:pre-wrap}
.ctx{grid-column:2/4;color:var(--mute);font-size:12.5px;display:none}.row.cur .ctx{display:block}
.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;color:var(--mute)}
.inp{grid-column:3;display:none}.row.cur .inp{display:block}
.shot{grid-column:2;display:none;font-size:12px;color:var(--mute)}.row.cur .shot{display:block}
.frame{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:#fff}
.frame img{position:absolute;left:0}.mark{position:absolute;border:2px solid #e5484d;border-radius:4px}
textarea{width:100%;font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--acc);background:var(--bg);color:var(--fg);resize:vertical;min-height:34px}
.ok{color:var(--ok);font-size:12px}
#out{display:none;position:fixed;inset:15% 20%;z-index:3;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 8px 40px #0005}
#out textarea{height:calc(100% - 50px)}
</style></head><body>

function go(i){i=Math.max(0,Math.min(ROWS.length-1,i));document.querySelector(".row.cur")?.classList.remove("cur");st.curId=ROWS[i].id;save();const el=document.getElementById("r"+i);el.classList.add("cur");shot(el,ROWS[i]);el.querySelector(".inp").appendChild(box);const t=box;t.value=st.b[ROWS[i].id]||"";el.scrollIntoView({block:"center"});t.focus({preventScroll:true});}
function prompt_(){const num=id=>[id[0]==="T"?0:1,parseInt(id.replace("T",""),10)];const keys=Object.keys(st.b).sort((x,y)=>{const a=num(x),b=num(y);return a[0]-b[0]||a[1]-b[1];});const fixed=keys.filter(id=>st.b[id]).map(id=>`${id}: ${st.b[id].replace(/\n/g," / ")}`);
const ranges=[];for(const id of keys){const r=ranges[ranges.length-1],n=num(id);if(r&&n[0]===r[2]&&n[1]===r[3]+1){r[1]=id;r[3]=n[1];}else ranges.push([id,id,n[0],n[1]]);}
const lab=([a,b])=>a===b?a:a+"-"+b;
return `${PREFIX}\nanswered: ${ranges.map(lab).join(", ")||"none"}\n${fixed.length?"corrections:\n"+fixed.join("\n"):"no corrections"}`;}
async function copy(){const p=prompt_();document.getElementById("outText").value=p;document.getElementById("out").style.display="block";try{await navigator.clipboard.writeText(p);}catch(e){const t=document.getElementById("outText");t.select();document.execCommand("copy");}}
document.getElementById("copy").onclick=copy;document.getElementById("close").onclick=()=>{document.getElementById("out").style.display="none";go(IDX[st.curId]);};
list.addEventListener("click",e=>{const r=e.target.closest(".row");if(r&&!r.classList.contains("cur"))go(+r.dataset.i);});
list.addEventListener("keydown",e=>{const t=e.target;if(t.tagName!=="TEXTAREA")return;const i=IDX[st.curId];
 if(e.key==="Enter"&&e.shiftKey){e.preventDefault();go(i-1);return;}
 if(e.key==="Enter"&&!e.altKey){e.preventDefault();st.b[ROWS[i].id]=t.value.trim();save();paint(i);stat();if(i===ROWS.length-1)copy();else go(i+1);return;}
 if(e.key==="e"&&e.ctrlKey){e.preventDefault();t.value=ROWS[i].fi;}});
ROWS.forEach((_,i)=>paint(i));stat();save();go(IDX[st.curId]??Math.max(0,ROWS.findIndex(r=>!(r.id in st.b))));
</script></body></html>
